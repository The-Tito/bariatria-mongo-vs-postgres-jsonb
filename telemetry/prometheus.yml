# Telemetría del playbook (§7): cAdvisor (contenedores, cgroups v2) y Node Exporter (host), cada 1 s.
global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
